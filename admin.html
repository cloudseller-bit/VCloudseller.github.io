<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAD-A-F MART Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0720">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="admin-192.png">
<link rel="apple-touch-icon" href="admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0E0720;--card:#1a0f33;--card2:#241545;--line:#3a2766;--tx:#f1eafd;--mut:#a99bd0;--acc:#a855f7;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
header{position:sticky;top:0;z-index:5;background:rgba(14,7,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header .row{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.ibtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.tabs{display:flex;gap:6px;max-width:640px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;min-height:40px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.tab b{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn);color:#1a0f33;font-size:12px}
.tab b.z{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--mut);font-size:13px}
.big{font-size:22px;font-weight:800}
.row2{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;min-height:46px;background:var(--acc);color:#fff}
.btn.ok{background:#16a34a}.btn.no{background:#b91c1c}.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font:14px/1.4 inherit;background:var(--card2);border-radius:10px;padding:10px}
.f{display:grid;gap:10px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
label{font-size:13px;color:var(--mut)}
.msg{min-height:1.4em;font-size:14px;margin:8px 0 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.stars{color:var(--warn);letter-spacing:2px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#1a0f33;padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw}
.cm{max-width:82%;padding:9px 12px;border-radius:14px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.cm small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.cm.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.cm.them{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(3,1,10,.7)}
.panel{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;max-height:92vh;display:flex;flex-direction:column}
.log{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:200px;max-height:55vh;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin:8px 0}
.send{display:flex;gap:8px}.send .btn{flex:0 0 auto;padding-inline:22px}
.nw{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--warn);color:#1a0f33;font-size:11px;font-weight:800}
.sum{color:var(--mut);font-size:14px;margin:10px 0 0}
[hidden]{display:none!important}
.login{min-height:80vh;display:flex;align-items:center}
.login .card{width:100%}
.sub{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.chk{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
.chk label{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}
.chk input{width:20px;min-height:20px}
.acts{display:flex;gap:8px}.acts .btn{min-height:40px;padding:8px}
.acts .btn.sm{flex:0 0 52px}
.srow{display:grid;grid-template-columns:1fr 84px;gap:8px;margin-bottom:6px}
.irow{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
</style>
</head>
<body>

<div id="loginView" class="wrap login" hidden>
  <div class="card">
    <h3 style="font-size:20px">SAD-A-F MART Admin</h3>
    <p class="meta">Owner only. Log in with your shop account.</p>
    <form class="f" id="loginForm" autocomplete="on">
      <div><label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="lbtn" type="submit">Log in</button>
    </form>
    <p class="msg" id="lmsg" role="status"></p>
  </div>
</div>

<div id="appView" hidden>
  <header>
    <div class="row">
      <h1>SAD-A-F Admin<small id="who"></small></h1>
      <button class="ibtn" id="refresh" type="button" aria-label="Refresh">Refresh</button>
      <button class="ibtn" id="logout" type="button">Log out</button>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="deposits" type="button">Deposits<b id="c_deposits" class="z">0</b></button>
      <button class="tab" data-t="orders" type="button">Orders<b id="c_orders" class="z">0</b></button>
      <button class="tab" data-t="completed" type="button">Completed</button>
      <button class="tab" data-t="reviews" type="button">Reviews<b id="c_reviews" class="z">0</b></button>
      <button class="tab" data-t="users" type="button">Users</button>
      <button class="tab" data-t="shop" type="button">Shop</button>
      <button class="tab" data-t="settings" type="button">Settings</button>
    </div>
  </header>
  <div class="wrap">
    <p class="msg" id="gmsg" role="status"></p>
    <div id="list"></div>
  </div>
</div>
<div class="sheet" id="chat" hidden>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:10px"><h3 id="chatTitle" style="flex:1;margin:0">Chat</h3><button class="ibtn" id="chatClose" type="button">Close</button></div>
    <div class="meta" id="chatInfo"></div>
    <div class="log" id="log"></div>
    <div class="send"><input id="chatIn" maxlength="500" autocomplete="off" placeholder="Write a message"><button class="btn" id="chatGo" type="button">Send</button></div>
    <p class="msg" id="chatMsg" role="status"></p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var FB={projectId:'sadafmart-6abd2',apiKey:'AIzaSyC_3DRxGo7BwEj1icqFRdMXKCY--3CyYXo'};
var DB='projects/'+FB.projectId+'/databases/(default)/documents';
var BASE='https://firestore.googleapis.com/v1/'+DB;
var IDT='https://identitytoolkit.googleapis.com/v1/accounts:';
var dq='',auth=null,tab='deposits',conf=null,lastPend=-1,audioCtx=null,data={deposits:[],orders:[],completed:[],reviews:[],users:[],paid:[]},usersById={},msgs={},busy=false,timer=null,uq='',chatOrder=null,chatTimer=null,chatBusy=false;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function jf(url,opt){return fetch(url,opt).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){}return {ok:r.ok,status:r.status,json:j}})})}
function sv(f){return (f&&f.stringValue)||''}
function nv(f){if(!f)return 0;if(f.integerValue!==undefined)return parseInt(f.integerValue,10)||0;if(f.doubleValue!==undefined)return +f.doubleValue||0;return 0}
function tv(f){return f&&f.timestampValue?Date.parse(f.timestampValue):0}
function when(ms){if(!ms)return '';var d=new Date(ms);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}
function emailOf(u){return u.trim().toLowerCase()+'@sadafmart.app'}

/* ---- session ---- */
function save(){try{localStorage.setItem('sfa_auth',JSON.stringify({uid:auth.uid,username:auth.username,refresh:auth.refresh}))}catch(e){}}
function load(){try{var o=JSON.parse(localStorage.getItem('sfa_auth')||'null');if(o&&o.uid&&o.refresh)auth={uid:o.uid,username:o.username,refresh:o.refresh,idToken:'',exp:0}}catch(e){}}
function logout(){auth=null;try{localStorage.removeItem('sfa_auth')}catch(e){}clearInterval(timer);show()}
function token(){
  if(!auth)return Promise.reject(new Error('auth'));
  if(auth.idToken&&Date.now()<auth.exp-60000)return Promise.resolve(auth.idToken);
  return jf('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refresh)}).then(function(r){
    if(!r.ok||!r.json.id_token){if(r.status===400||r.status===401)logout();throw new Error('auth')}
    auth.idToken=r.json.id_token;auth.refresh=r.json.refresh_token||auth.refresh;auth.exp=Date.now()+(parseInt(r.json.expires_in,10)||3600)*1000;save();return auth.idToken;
  });
}
function api(method,url,body){
  function go(tk){return jf(url,{method:method,headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
  return token().then(go).then(function(r){if(r.status===401&&auth){auth.idToken='';return token().then(go)}return r});
}
function runQ(coll,field,val,lim){
  var q={from:[{collectionId:coll}],limit:lim||100};
  if(field)q.where={fieldFilter:{field:{fieldPath:field},op:'EQUAL',value:val}};
  return api('POST',BASE+':runQuery',{structuredQuery:q});
}
function commit(writes){return api('POST',BASE+':commit',{writes:writes})}
function docName(coll,id){return DB+'/'+coll+'/'+id}

/* ---- load ---- */
function rows(r){return (Array.isArray(r.json)?r.json:[]).filter(function(x){return x.document}).map(function(x){var d=x.document;return {id:d.name.split('/').pop(),f:d.fields||{},ut:d.updateTime}})}
function loadAll(){
  if(busy)return Promise.resolve();busy=true;
  return Promise.all([
    runQ('deposits','status',{stringValue:'pending'}),
    runQ('orders','status',{stringValue:'pending'}),
    runQ('reviews','approved',{booleanValue:false}),
    runQ('users'),
    runQ('orders','status',{stringValue:'done'}),
    runQ('messages',null,null,500),
    runQ('deposits','status',{stringValue:'approved'},300),
    api('GET',BASE+'/config/site'),
    api('GET',BASE+'/config/catalog')
  ]).then(function(rs){
    if(rs.some(function(r){return r.status===403})){
      var nm=['deposits','orders','reviews','users','completed orders','messages','approved deposits','config','catalog'],bad=[];rs.forEach(function(r,i){if(r.status===403)bad.push(nm[i])});
      $('gmsg').style.color='var(--bad)';$('gmsg').textContent=(bad.length<rs.length?'Rules are missing for: '+bad.join(', ')+'. Paste BOTH rules parts (Part 1 + Part 2) in Firebase and Publish. ':'This account is not the admin. ')+'Your UID is: '+auth.uid+' (it must be exactly the same as the UID inside the rules).';return;
    }
    $('gmsg').textContent='';
    data.deposits=rows(rs[0]).sort(function(a,b){return tv(a.f.createdAt)-tv(b.f.createdAt)});
    data.orders=rows(rs[1]).sort(function(a,b){return tv(a.f.createdAt)-tv(b.f.createdAt)});
    data.reviews=rows(rs[2]).sort(function(a,b){return tv(b.f.createdAt)-tv(a.f.createdAt)});
    data.users=rows(rs[3]).sort(function(a,b){return nv(b.f.balance)-nv(a.f.balance)});
    usersById={};data.users.forEach(function(u){usersById[u.id]=u});
    data.completed=rows(rs[4]).sort(function(a,b){return tv(b.f.createdAt)-tv(a.f.createdAt)});
    msgs={};rows(rs[5]).forEach(function(m){var o=sv(m.f.orderId);(msgs[o]=msgs[o]||[]).push({from:sv(m.f.from),text:sv(m.f.text),time:tv(m.f.createdAt)})});
    Object.keys(msgs).forEach(function(k){msgs[k].sort(function(a,b){return a.time-b.time})});
    data.paid=rows(rs[6]);
    if(rs[7].ok&&rs[7].json&&rs[7].json.fields)conf=rs[7].json.fields;else if(rs[7].status===404)conf={};
    if(rs[8]&&rs[8].ok&&rs[8].json&&rs[8].json.fields&&rs[8].json.fields.data){try{catSaved=JSON.parse(rs[8].json.fields.data.stringValue)}catch(e){}}
    if(!catDirty)cat=null;
    var pend=data.deposits.length+data.orders.length+data.reviews.length+Object.keys(msgs).filter(function(k){return isNew(k)}).length;
    if(lastPend>=0&&pend>lastPend)alertNew();
    lastPend=pend;
  }).catch(function(){$('gmsg').style.color='var(--bad)';$('gmsg').textContent='Could not load. Check your internet.'}).then(function(){busy=false;paint()});
}

/* ---- alerts, stats, checks ---- */
function alertNew(){
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audioCtx.destination);
    o.start();o.frequency.setValueAtTime(1175,audioCtx.currentTime+.15);o.stop(audioCtx.currentTime+.32);
  }catch(e){}
  toast('Something new needs you');
}
function parseBonus(str){var a=[];String(str||'').split(/[,\n]/).forEach(function(p){var m=p.trim().match(/^(\d{2,6})\s*=\s*(\d{1,2})$/);if(m&&+m[2]>0&&+m[2]<=50)a.push({min:+m[1],pct:+m[2]})});return a}
function bonusFor(amt){var b=0;parseBonus(conf&&conf.bonus?conf.bonus.stringValue:'').forEach(function(x){if(amt>=x.min)b=Math.floor(amt*x.pct/100)});return b}
function checkTotal(d){
  var tx=sv(d.f.itemsText),sum=0,disc=0,m,re=/^- .* = (\d+(?:\.\d+)?) TK$/gm;
  while((m=re.exec(tx)))sum+=parseFloat(m[1]);
  var dm=tx.match(/^Discount \(.*\): -(\d+) TK$/m);if(dm)disc=parseInt(dm[1],10);
  var expect=Math.round(sum-disc);
  return sum>0&&expect!==nv(d.f.total)?expect:null;
}
function statsHtml(){
  var now=Date.now(),day=new Date();day.setHours(0,0,0,0);var t0=day.getTime(),w0=now-7*864e5;
  function agg(list,fld){var a={t:0,w:0,all:0,nt:0};list.forEach(function(d){var v=nv(d.f[fld]),c=tv(d.f.createdAt);a.all+=v;if(c>=w0)a.w+=v;if(c>=t0){a.t+=v;a.nt++}});return a}
  var o=agg(data.completed,'total'),p=agg(data.paid,'amount');
  return '<div class="card"><h3>Sales (completed orders)</h3><div class="meta">Today '+o.t+' TK · 7 days '+o.w+' TK · All '+o.all+' TK</div><h3 style="margin-top:10px">Deposits approved</h3><div class="meta">Today '+p.t+' TK · 7 days '+p.w+' TK · All '+p.all+' TK</div></div>';
}
function soldItems(){var c=curCat(),a=[];c.plans.forEach(function(p){a.push([p.id,p.label+' plan'])});a.push(['robux','Robux']);c.cats.forEach(function(k){k.items.forEach(function(it){a.push([it.id,it.name])})});return a}
function soldList(f){var cur=sv(f.soldout).split(',').map(function(x){return x.trim()});return soldItems().map(function(x){return '<label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:15px;color:var(--tx)"><input type="checkbox" class="so-cb" value="'+x[0]+'" style="width:22px;min-height:22px;height:22px"'+(cur.indexOf(x[0])>-1?' checked':'')+'>'+x[1]+'</label>'}).join('')}
function settingsHtml(){
  var f=conf||{},open=!(f.open&&f.open.booleanValue===false);
  return '<div class="card"><h3>Shop settings</h3><p class="meta">These change the website right away. No upload needed.</p><div class="f">'+
    '<div><label for="sOpen">Shop status</label><select id="sOpen"><option value="1"'+(open?' selected':'')+'>Open: taking orders</option><option value="0"'+(open?'':' selected')+'>Closed: orders paused</option></select></div>'+
    '<div><label for="sAnn">Announcement banner (leave empty to hide)</label><input id="sAnn" maxlength="200" value="'+esc(sv(f.announcement))+'"></div>'+
    '<div><label for="sPromo">Promo codes (CODE=percent, one per line)</label><textarea id="sPromo" rows="4" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;color:inherit;font:inherit" placeholder="WELCOME10=10&#10;EID5=5">'+esc(sv(f.promos))+'</textarea></div>'+
    '<div><label for="sBonus">Deposit bonus (minimum=percent, one per line)</label><textarea id="sBonus" rows="3" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;color:inherit;font:inherit" placeholder="500=2&#10;1000=5">'+esc(sv(f.bonus))+'</textarea></div>'+
    '<div><label>Sold out (tick what you cannot sell right now)</label><div style="display:grid;gap:8px;margin-top:6px">'+soldList(f)+'</div></div>'+
    '<button class="btn" id="sSave" type="button">Save settings</button></div><p class="msg" id="sMsg" role="status"></p></div>';
}

/* ---- chat helpers ---- */
function lastBuyer(id){var l=msgs[id]||[],t=0;l.forEach(function(m){if(m.from==='buyer'&&m.time>t)t=m.time});return t}
function seen(id){try{return +localStorage.getItem('sfa_seen_'+id)||0}catch(e){return 0}}
function markSeen(id){try{localStorage.setItem('sfa_seen_'+id,String(lastBuyer(id)))}catch(e){}}
function isNew(id){return lastBuyer(id)>seen(id)}
function orderBtns(d){var n=(msgs[d.id]||[]).length;return '<button class="btn ghost" data-a="chat" data-id="'+d.id+'" type="button">Chat'+(n?' ('+n+')':'')+(isNew(d.id)?' <span class="nw">NEW</span>':'')+'</button>'}


/* ---- Shop editor (prices, items, categories) ---- */
var DEFAULT_CAT={rate:1,plans:[
 {id:'p12',label:'12 hours',title:'Overnight',note:'One night of farming.',price:40,hours:12,best:false,hide:false},
 {id:'p24',label:'24 hours',title:'Full day',note:'A full day and night.',price:70,hours:24,best:false,hide:false},
 {id:'p48',label:'48 hours',title:'Weekend',note:'50 TK per day.',price:100,hours:48,best:false,hide:false},
 {id:'p7',label:'7 days',title:'Weekly',note:'About 34 TK per day.',price:240,hours:168,best:false,hide:false},
 {id:'p30',label:'30 days',title:'Monthly',note:'About 21 TK per day.',price:640,hours:720,best:true,hide:false}],
 cats:[
 {id:'pets',title:'Grow a Garden pets',hide:false,items:[
  {id:'mimic',name:'Mimic',sub:'',full:'Mimic (Grow a Garden pet)',price:20,hide:false},
  {id:'spider',name:'Ghostly Spider',sub:'',full:'Ghostly Spider (Grow a Garden pet)',price:800,hide:false},
  {id:'tokens',name:'Tokens',sub:'1,000 tokens',full:'1,000 tokens',price:170,hide:false}]},
 {id:'dice',title:'Anime Dice',hide:false,items:[
  {id:'dice1',name:'1 OC',sub:'',full:'Anime Dice 1 OC',price:4,hide:false},
  {id:'dice10',name:'10 OC',sub:'',full:'Anime Dice 10 OC',price:10,hide:false},
  {id:'dice40',name:'40 OC',sub:'',full:'Anime Dice 40 OC',price:20,hide:false},
  {id:'dice100',name:'100 OC',sub:'',full:'Anime Dice 100 OC',price:40,hide:false},
  {id:'spin',name:'Jackpot spins',sub:'Price per spin',full:'Anime Dice jackpot spin',price:10,hide:false}]}]};
var catSaved=null,cat=null,catDirty=false,shopForce=false;
function cclone(o){return JSON.parse(JSON.stringify(o))}
function curCat(){return cat||(cat=cclone(catSaved||DEFAULT_CAT))}
function newId(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function fld(m,idx,f,label,val,extra,type){
  return '<div><label>'+label+'</label><input '+(type==='num'?'type="number" inputmode="decimal" step="any" min="0" ':'')+'data-m="'+m+'" '+idx+' data-f="'+f+'" value="'+esc(String(val==null?'':val))+'" maxlength="'+(extra||60)+'"></div>';
}
function chk(m,idx,f,label,val){return '<label><input type="checkbox" data-m="'+m+'" '+idx+' data-f="'+f+'"'+(val?' checked':'')+'> '+label+'</label>'}
function moveBtns(k,idx){return '<button class="btn ghost sm" data-s="'+k+'up" '+idx+' type="button">↑</button><button class="btn ghost sm" data-s="'+k+'down" '+idx+' type="button">↓</button>'}
function shopHtml(){
  var c=curCat(),h='<div id="shopRoot"><div class="card"><h3>Shop prices and items</h3><p class="meta">Change prices and names, add new items, hide things, then tap Save. The website updates by itself within about a minute. Unsaved changes are kept here until you save.</p><div class="acts" style="margin-top:10px"><button class="btn" data-s="save" type="button">Save changes</button></div><p class="msg" id="shopMsg" role="status"></p></div>';
  h+='<div class="card"><h3>AFK farming plans</h3>';
  c.plans.forEach(function(p,i){
    var ix='data-i="'+i+'"';
    h+='<div class="sub"><div class="g2">'+fld('plan',ix,'label','Name (like 12 hours)',p.label,40)+fld('plan',ix,'price','Price (TK)',p.price,10,'num')+'</div><div class="g2">'+fld('plan',ix,'title','Title',p.title,40)+fld('plan',ix,'hours','Hours (for timer)',p.hours,6,'num')+'</div>'+
      '<div style="margin-bottom:8px">'+fld('plan',ix,'note','Short note',p.note,100)+'</div><div class="chk">'+chk('plan',ix,'best','Best value badge',p.best)+chk('plan',ix,'hide','Hide from shop',p.hide)+'</div>'+
      '<div class="acts">'+moveBtns('p',ix)+'<button class="btn no" data-s="pdel" '+ix+' type="button">Delete</button></div></div>';
  });
  h+='<button class="btn ghost" data-s="padd" type="button" style="width:100%">+ Add plan</button></div>';
  h+='<div class="card"><h3>Robux</h3><div class="srow"><div><label>Price of 1 Robux (TK)</label></div><input type="number" inputmode="decimal" step="any" min="0" data-m="rate" data-f="rate" value="'+esc(String(c.rate))+'"></div></div>';
  c.cats.forEach(function(k,ci){
    var cx='data-i="'+ci+'"';
    h+='<div class="card"><h3>Category</h3><div style="margin-bottom:8px">'+fld('cat',cx,'title','Category name',k.title,40)+'</div><div class="chk">'+chk('cat',cx,'hide','Hide whole category',k.hide)+'</div>';
    k.items.forEach(function(it,ii){
      var ix='data-c="'+ci+'" data-i="'+ii+'"';
      h+='<div class="irow"><div class="g2">'+fld('item',ix,'name','Item name',it.name,60)+fld('item',ix,'price','Price (TK)',it.price,10,'num')+'</div><div style="margin-bottom:8px">'+fld('item',ix,'sub','Small text under the name (optional)',it.sub,60)+'</div><div class="chk">'+chk('item',ix,'hide','Hide',it.hide)+'</div><div class="acts">'+moveBtns('i',ix)+'<button class="btn no" data-s="idel" '+ix+' type="button">Delete</button></div></div>';
    });
    h+='<button class="btn ghost" data-s="iadd" '+cx+' type="button" style="width:100%;margin-top:12px">+ Add item to this category</button><div class="acts" style="margin-top:10px">'+moveBtns('c',cx)+'<button class="btn no" data-s="cdel" '+cx+' type="button">Delete category</button></div></div>';
  });
  h+='<div class="card"><button class="btn ghost" data-s="cadd" type="button" style="width:100%">+ Add category</button></div>';
  h+='<div class="card"><div class="acts"><button class="btn" data-s="save" type="button">Save changes</button><button class="btn ghost" data-s="reset" type="button">Reset to original</button></div></div></div>';
  return h;
}
function shopSave(btn){
  var c=curCat(),m=$('shopMsg'),out={rate:1,plans:[],cats:[]},bad='';
  var r=parseFloat(c.rate);if(!(r>0&&r<=100))bad='Robux price must be more than 0.';else out.rate=r;
  c.plans.forEach(function(p){var pr=parseFloat(p.price);if(!String(p.label).trim()||!(pr>0))bad=bad||'Every plan needs a name and a price above 0.';out.plans.push({id:p.id,label:String(p.label).trim(),title:String(p.title||''),note:String(p.note||''),price:pr,hours:Math.max(0,parseInt(p.hours,10)||0),best:!!p.best,hide:!!p.hide})});
  c.cats.forEach(function(k){var ck={id:k.id,title:String(k.title||'').trim()||'Items',hide:!!k.hide,items:[]};k.items.forEach(function(it){var pr=parseFloat(it.price);if(!String(it.name).trim()||!(pr>0))bad=bad||'Every item needs a name and a price above 0.';ck.items.push({id:it.id,name:String(it.name).trim(),sub:String(it.sub||''),full:String(it.full||it.name),price:pr,hide:!!it.hide})});out.cats.push(ck)});
  if(bad){m.style.color='var(--bad)';m.textContent=bad;return}
  btn.disabled=true;m.style.color='var(--mut)';m.textContent='Saving...';
  var str=JSON.stringify(out);
  commit([{update:{name:docName('config','catalog'),fields:{data:{stringValue:str}}},updateMask:{fieldPaths:['data']}}]).then(function(r2){
    if(!r2.ok)throw new Error('x');catSaved=cclone(out);cat=cclone(out);catDirty=false;
    m.style.color='var(--ok)';m.textContent='Saved. The website will show this soon.';toast('Saved');
  }).catch(function(){m.style.color='var(--bad)';m.textContent='Could not save. Check the rules are published.'}).then(function(){btn.disabled=false});
}
function swap(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t}
$('list').addEventListener('input',function(e){
  var el=e.target,m=el.dataset&&el.dataset.m;if(!m)return;
  var c=curCat(),f=el.dataset.f,v=el.type==='checkbox'?el.checked:el.value,o=null;
  if(m==='rate'){c.rate=v}
  else{
    if(m==='plan')o=c.plans[+el.dataset.i];else if(m==='cat')o=c.cats[+el.dataset.i];else if(m==='item'&&c.cats[+el.dataset.c])o=c.cats[+el.dataset.c].items[+el.dataset.i];
    if(!o)return;o[f]=v;if(m==='item'&&f==='name')o.full=v;
  }
  catDirty=true;var mm=$('shopMsg');if(mm)mm.textContent='';
});
$('list').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-s]'):null;if(!b)return;
  var k=b.dataset.s,c=curCat(),i=+b.dataset.i,ci=+b.dataset.c;
  if(k==='save'){shopSave(b);return}
  if(k==='padd')c.plans.push({id:newId('p'),label:'New plan',title:'',note:'',price:50,hours:24,best:false,hide:false});
  else if(k==='pdel'){if(!confirm('Delete this plan?'))return;c.plans.splice(i,1)}
  else if(k==='pup')swap(c.plans,i,-1);else if(k==='pdown')swap(c.plans,i,1);
  else if(k==='cadd')c.cats.push({id:newId('c'),title:'New category',hide:false,items:[]});
  else if(k==='cdel'){if(!confirm('Delete this whole category and its items?'))return;c.cats.splice(i,1)}
  else if(k==='cup')swap(c.cats,i,-1);else if(k==='cdown')swap(c.cats,i,1);
  else if(k==='iadd')c.cats[i].items.push({id:newId('i'),name:'New item',sub:'',full:'New item',price:10,hide:false});
  else if(k==='idel'){if(!confirm('Delete this item?'))return;c.cats[ci].items.splice(i,1)}
  else if(k==='iup')swap(c.cats[ci].items,i,-1);else if(k==='idown')swap(c.cats[ci].items,i,1);
  else if(k==='reset'){if(!confirm('Go back to the original prices and items? (You still need to tap Save.)'))return;cat=cclone(DEFAULT_CAT)}
  else return;
  catDirty=true;shopForce=true;paint();
});

    if(hist.length)h+='<h3 style="margin:22px 0 4px">Recently approved</h3>'+hist.map(function(d){var f=d.f;return '<div class="card" style="padding:10px 14px"><b>+'+nv(f.amount)+(nv(f.bonus)?' (+'+nv(f.bonus)+' bonus)':'')+' TK</b> · '+esc(sv(f.username))+'<div class="meta">'+esc(sv(f.method))+' · '+esc(sv(f.trxId))+' · '+when(tv(f.createdAt))+'</div></div>'}).join('');

  }else if(tab==='shop'){
    if(!document.getElementById('shopRoot')||shopForce){h=shopHtml();shopForce=false}else return;
  }else if(tab==='settings'){

/* ---- actions ---- */
function find(coll,id){return data[coll].filter(function(x){return x.id===id})[0]}
function findOrder(id){return find('orders',id)||find('completed',id)}
function pre(ut){return ut?{updateTime:ut}:{exists:true}}
function act(btn,fn){
  if(btn.disabled)return;btn.disabled=true;
  fn().then(function(r){
    if(r&&r.ok){toast('Done');return loadAll()}
    if(r&&r.status===400||r&&r.status===409||r&&r.status===412){toast('Already changed. Refreshing');return loadAll()}
    toast('Failed. Try again.');
  }).catch(function(){toast('No connection')}).then(function(){btn.disabled=false});
}
function onAct(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,d;
  if(a==='chat'){openChat(id);return}
  if(a==='dep-ok'){
    d=find('deposits',id);if(!d)return;var amt=nv(d.f.amount),uid=sv(d.f.uid),bn=bonusFor(amt),tot=amt+bn;
    if(!confirm('Approve '+amt+' TK'+(bn?' + '+bn+' TK bonus':'')+' for '+sv(d.f.username)+'? This adds '+tot+' TK to their balance.'))return;
    var fl={status:{stringValue:'approved'}},mk=['status'];if(bn){fl.bonus={integerValue:String(bn)};mk.push('bonus')}
    act(b,function(){return commit([
      {update:{name:docName('deposits',id),fields:fl},updateMask:{fieldPaths:mk},currentDocument:pre(d.ut)},
      {transform:{document:docName('users',uid),fieldTransforms:[{fieldPath:'balance',increment:{integerValue:String(tot)}}]},currentDocument:{exists:true}}
    ])});
  }else if(a==='dep-no'){
    d=find('deposits',id);if(!d)return;
    var why=prompt('Why are you rejecting this deposit? The customer will see it. You can leave it empty.','Payment not received');
    if(why===null)return;why=why.trim().slice(0,120);
    var fl2={status:{stringValue:'rejected'}},mk2=['status'];if(why){fl2.note={stringValue:why};mk2.push('note')}
    act(b,function(){return commit([{update:{name:docName('deposits',id),fields:fl2},updateMask:{fieldPaths:mk2},currentDocument:pre(d.ut)}])});
  }else if(a==='ord-ok'){
    d=find('orders',id);if(!d)return;var tot=nv(d.f.total),uid2=sv(d.f.uid),u=usersById[uid2];
    if(!u||nv(u.f.balance)<tot){toast('Not enough balance. Cancel it or add balance first.');return}
    if(!confirm('Mark done and take '+tot+' TK from '+sv(d.f.username)+'?'))return;
    act(b,function(){return commit([
      {update:{name:docName('orders',id),fields:{status:{stringValue:'done'}}},updateMask:{fieldPaths:['status']},currentDocument:pre(d.ut)},
      {transform:{document:docName('users',uid2),fieldTransforms:[{fieldPath:'balance',increment:{integerValue:String(-tot)}}]},currentDocument:{exists:true}}
    ])});
  }else if(a==='ord-no'){
    d=find('orders',id);if(!d)return;if(!confirm('Cancel this order? No money is taken.'))return;
    act(b,function(){return commit([{update:{name:docName('orders',id),fields:{status:{stringValue:'cancelled'}}},updateMask:{fieldPaths:['status']},currentDocument:pre(d.ut)}])});
  }else if(a==='rev-ok'){
    d=find('reviews',id);if(!d)return;
    act(b,function(){return commit([{update:{name:docName('reviews',id),fields:{approved:{booleanValue:true}}},updateMask:{fieldPaths:['approved']},currentDocument:pre(d.ut)}])});
  }else if(a==='rev-no'){
    if(!confirm('Delete this review for good?'))return;
    act(b,function(){return commit([{delete:docName('reviews',id)}])});
  }else if(a==='bal'){
    d=find('users',id);if(!d)return;
    var v=prompt('Change balance for '+sv(d.f.username)+' (now '+nv(d.f.balance)+' TK).\nType +50 to add or -50 to remove:','');
    if(v==null)return;v=v.trim();
    if(!/^[+-]?\d{1,6}$/.test(v)||+v===0){toast('Type a number like +50 or -50');return}
    var n=parseInt(v,10);
    if(nv(d.f.balance)+n<0){toast('Balance cannot go below 0');return}
    act(b,function(){return commit([{transform:{document:docName('users',id),fieldTransforms:[{fieldPath:'balance',increment:{integerValue:String(n)}}]},currentDocument:{exists:true}}])});
  }
}

/* ---- chat ---- */
function drawChat(){
  var log=$('log'),near=log.scrollHeight-log.scrollTop-log.clientHeight<80,first=!log.childNodes.length;
  log.innerHTML='';var l=msgs[chatOrder]||[];
  if(!l.length)log.innerHTML='<div class="empty">No messages yet. Say hi to the buyer.</div>';
  l.forEach(function(m){var d=document.createElement('div');d.className='cm '+(m.from==='admin'?'me':'them');d.appendChild(document.createTextNode(m.text));var sm=document.createElement('small');sm.textContent=m.time?when(m.time):'';d.appendChild(sm);log.appendChild(d)});
  if(first||near)log.scrollTop=log.scrollHeight;
}
function pollChat(){
  if(!chatOrder||chatBusy)return Promise.resolve();chatBusy=true;var id=chatOrder;
  return runQ('messages','orderId',{stringValue:id}).then(function(r){
    if(id!==chatOrder||!Array.isArray(r.json))return;
    msgs[id]=rows(r).map(function(m){return {from:sv(m.f.from),text:sv(m.f.text),time:tv(m.f.createdAt)}}).sort(function(a,b){return a.time-b.time});
    drawChat();markSeen(id);
  }).catch(function(){}).then(function(){chatBusy=false});
}
function openChat(id){
  var d=findOrder(id);if(!d)return;chatOrder=id;
  $('chatTitle').textContent='Chat with '+sv(d.f.username);
  $('chatInfo').textContent=nv(d.f.total)+' TK · '+sv(d.f.status);
  $('chatMsg').textContent='';$('chatIn').value='';$('log').innerHTML='';
  $('chat').hidden=false;document.body.style.overflow='hidden';
  drawChat();markSeen(id);pollChat();
  clearInterval(chatTimer);chatTimer=setInterval(function(){if(!document.hidden)pollChat()},6000);
}
function closeChat(){$('chat').hidden=true;chatOrder=null;clearInterval(chatTimer);document.body.style.overflow='';paint()}
function sendChat(){
  var tx=$('chatIn').value.trim(),d=chatOrder&&findOrder(chatOrder);if(!tx||!d)return;
  var b=$('chatGo');b.disabled=true;
  api('POST',BASE+'/messages',{fields:{uid:{stringValue:sv(d.f.uid)},orderId:{stringValue:chatOrder},from:{stringValue:'admin'},text:{stringValue:tx.slice(0,500)},createdAt:{timestampValue:new Date().toISOString()}}}).then(function(r){
    if(!r.ok)throw new Error('x');$('chatIn').value='';$('chatMsg').textContent='';chatBusy=false;return pollChat();
  }).catch(function(){$('chatMsg').style.color='var(--bad)';$('chatMsg').textContent='Could not send. Try again.'}).then(function(){b.disabled=false});
}
$('chatGo').addEventListener('click',sendChat);
$('chatIn').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendChat()}});
$('chatClose').addEventListener('click',closeChat);

    if(!r.ok){m.style.color='var(--bad)';m.textContent='Wrong username or password.';return}

$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;paint()});
$('list').addEventListener('click',function(e){
  if(e.target&&e.target.id==='sSave'){
    var b=e.target,m=$('sMsg');b.disabled=true;m.style.color='var(--mut)';m.textContent='Saving...';
    var promos=$('sPromo').value.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean).join('\n');
    var bonus=$('sBonus').value.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean).join('\n');
